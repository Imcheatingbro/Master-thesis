# Windows/NVIDIA environment for serving the Qwen3 LoRA and QLoRA checkpoints.
# This reproduces the validated LLaMA-Factory and Unsloth inference stack.
name: Qwen_checkpoint
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - git
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128
      - transformers==5.5.0
      - datasets==3.6.0
      - accelerate==1.11.0
      - peft==0.18.1
      - trl==0.24.0
      - bitsandbytes==0.50.1
      - unsloth==2026.8.18
      - unsloth_zoo==2026.8.13
      - torchao==0.17.0
      - triton-windows==3.7.1.post27
      - xformers==0.0.35
      - cut-cross-entropy==25.1.1
      - fastapi==0.136.3
      - uvicorn==0.47.0
      - safetensors==0.8.0
      - sentencepiece==0.2.1
      - "llamafactory @ git+https://github.com/hiyouga/LlamaFactory.git@ff6d4d12eeb035d6ce06805a5733dd7b29f2ac30"
