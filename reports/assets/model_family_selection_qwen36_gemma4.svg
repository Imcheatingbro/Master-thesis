<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
<title id="title">Published General-Capability Evidence for Model-Family Selection</title>
<desc id="description">Grouped bar chart comparing representative Qwen 3.6 and Gemma 4 checkpoints on four public benchmarks.</desc>
<style>
          .title { font: 600 25px Arial, sans-serif; fill: #111827; }
          .axis { font: 16px Arial, sans-serif; fill: #374151; }
          .tick { font: 14px Arial, sans-serif; fill: #4b5563; }
          .label { font: 600 15px Arial, sans-serif; fill: #1f2937; }
          .legend { font: 15px Arial, sans-serif; fill: #374151; }
          .note { font: 13px Arial, sans-serif; fill: #64748b; }
          .grid { stroke: #dbe2ea; stroke-width: 1; }
        </style>
<rect width="1200" height="700" fill="#ffffff"/>
<rect x="110" y="135" width="1030" height="430" rx="8" fill="#fbfcfe"/>
<text x="600.0" y="52.0" class="title" text-anchor="middle">Published General-Capability Evidence for Model-Family Selection</text>
<line x1="110" y1="565.0" x2="1140" y2="565.0" class="grid"/>
<text x="92.0" y="570.0" class="tick" text-anchor="end">0</text>
<line x1="110" y1="479.0" x2="1140" y2="479.0" class="grid"/>
<text x="92.0" y="484.0" class="tick" text-anchor="end">20</text>
<line x1="110" y1="393.0" x2="1140" y2="393.0" class="grid"/>
<text x="92.0" y="398.0" class="tick" text-anchor="end">40</text>
<line x1="110" y1="307.0" x2="1140" y2="307.0" class="grid"/>
<text x="92.0" y="312.0" class="tick" text-anchor="end">60</text>
<line x1="110" y1="221.0" x2="1140" y2="221.0" class="grid"/>
<text x="92.0" y="226.0" class="tick" text-anchor="end">80</text>
<line x1="110" y1="135.0" x2="1140" y2="135.0" class="grid"/>
<text x="92.0" y="140.0" class="tick" text-anchor="end">100</text>
<text x="32" y="350.0" class="axis" text-anchor="middle" transform="rotate(-90 32 350)">Score (%)</text>
<rect x="154.0" y="198.6" width="76" height="366.4" rx="5" fill="#0f766e"/>
<text x="192.0" y="188.6" class="label" text-anchor="middle">85.2</text>
<rect x="240.0" y="198.6" width="76" height="366.4" rx="5" fill="#4f6bed"/>
<text x="278.0" y="188.6" class="label" text-anchor="middle">85.2</text>
<text x="235.0" y="601.0" class="tick" text-anchor="middle">MMLU-Pro</text>
<rect x="419.0" y="195.2" width="76" height="369.8" rx="5" fill="#0f766e"/>
<text x="457.0" y="185.2" class="label" text-anchor="middle">86.0</text>
<rect x="505.0" y="202.5" width="76" height="362.5" rx="5" fill="#4f6bed"/>
<text x="543.0" y="192.5" class="label" text-anchor="middle">84.3</text>
<text x="500.0" y="601.0" class="tick" text-anchor="middle">GPQA Diamond</text>
<rect x="684.0" y="219.3" width="76" height="345.7" rx="5" fill="#0f766e"/>
<text x="722.0" y="209.3" class="label" text-anchor="middle">80.4</text>
<rect x="770.0" y="221.0" width="76" height="344.0" rx="5" fill="#4f6bed"/>
<text x="808.0" y="211.0" class="label" text-anchor="middle">80.0</text>
<text x="765.0" y="601.0" class="tick" text-anchor="middle">LiveCodeBench v6</text>
<rect x="949.0" y="166.4" width="76" height="398.6" rx="5" fill="#0f766e"/>
<text x="987.0" y="156.4" class="label" text-anchor="middle">92.7</text>
<rect x="1035.0" y="181.4" width="76" height="383.6" rx="5" fill="#4f6bed"/>
<text x="1073.0" y="171.4" class="label" text-anchor="middle">89.2</text>
<text x="1030.0" y="601.0" class="tick" text-anchor="middle">AIME 2026</text>
<rect x="118" y="84" width="18" height="18" rx="3" fill="#0f766e"/>
<text x="146.0" y="98.0" class="legend" text-anchor="start">Qwen 3.6</text>
<rect x="245" y="84" width="18" height="18" rx="3" fill="#4f6bed"/>
<text x="273.0" y="98.0" class="legend" text-anchor="start">Gemma 4</text>
<text x="600.0" y="645.0" class="note" text-anchor="middle">Representative published checkpoints; vendor-reported results from the Qwen 3.6 model card.</text>
<text x="600.0" y="668.0" class="note" text-anchor="middle">Scores are evidence of comparable capability, not family-wide guarantees.</text>
</svg>