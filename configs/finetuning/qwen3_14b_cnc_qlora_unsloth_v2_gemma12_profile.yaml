### Qwen3-14B CNC: Gemma-4-12B v4 optimisation profile.
model_name_or_path: Qwen/Qwen3-14B
trust_remote_code: true
flash_attn: sdpa
use_unsloth: true
upcast_layernorm: true
cache_dir: outputs/cache/huggingface_datasets_v3_6

### Conservative adapter capacity requested for Qwen3-14B (r=16, alpha=32).
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target: all

### Qwen-native prompt/data are unchanged. 1536 covers the measured Qwen maximum (1487).
dataset_dir: Data/CNC_sft_qwen3_14b_original_v1
dataset: cnc_sft_train
eval_dataset: cnc_sft_validation
template: qwen3
enable_thinking: false
train_on_prompt: false
cutoff_len: 1536
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 0
overwrite_cache: true

### Independent outputs; mirrors Gemma 12B v4 checkpoint cadence.
output_dir: outputs/finetuning/qwen3_14b_cnc_qlora_unsloth_v2_gemma12_profile
logging_steps: 10
save_strategy: steps
save_steps: 50
save_total_limit: 10
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### Gemma 12B v4 optimisation profile: effective batch 16, about 291 steps.
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 30
weight_decay: 0.01
max_grad_norm: 0.5
bf16: true
fp16: false
gradient_checkpointing: true
optim: adamw_8bit
seed: 42
data_seed: 42

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
load_best_model_at_end: false
